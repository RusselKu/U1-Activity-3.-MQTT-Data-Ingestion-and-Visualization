version: '3.8'

services:
  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - data_pipeline_net
    restart: always

  # PostgreSQL Database
  postgres:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sensordata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - data_pipeline_net
    restart: always

  # Python Subscriber Service
  subscriber:
    build:
      context: ./subscriber
    container_name: subscriber
    depends_on:
      - mosquitto
      - postgres
    environment:
      - MQTT_BROKER=mosquitto
      - DB_HOST=postgres_db
      - DB_NAME=sensordata
      - DB_USER=user
      - DB_PASS=password
    networks:
      - data_pipeline_net
    restart: always

  # Streamlit Dashboard
  streamlit:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    container_name: streamlit_dashboard
    depends_on:
      - postgres
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_NAME=sensordata
      - DB_USER=user
      - DB_PASS=password
    networks:
      - data_pipeline_net
    restart: on-failure

volumes:
  postgres_data:

networks:
  data_pipeline_net:
    driver: bridge
